name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Structure & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Required files
        run: |
          for f in README.md LICENSE requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

      - name: Python syntax check (src/)
        run: python -m compileall -q src/

      - name: Shell scripts syntax check
        run: |
          fail=0
          for f in *.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "::error file=$f::shell syntax error"
              fail=1
            fi
          done
          exit $fail

      - name: YAML configs parse
        run: |
          pip install -q pyyaml
          python -c "
          import sys, pathlib, yaml
          fail = 0
          for p in list(pathlib.Path('config').rglob('*.yaml')) + list(pathlib.Path('config').rglob('*.yml')):
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  print(f'::error file={p}::{e}')
                  fail += 1
          sys.exit(fail)
          "

      - name: README internal links resolve
        run: |
          missing=0
          for link in $(grep -oE '\]\([^)]+\)' README.md | sed 's|](||; s|)$||' | grep -v '^http' | grep -v '^#' | sort -u); do
            path="${link%%#*}"
            [ -z "$path" ] && continue
            if [ ! -e "$path" ]; then
              echo "::warning::README links to missing path: $link"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing README link(s) point to non-existent paths"
          fi

      - name: No committed secrets
        run: |
          if grep -rEn 'AIza[0-9A-Za-z_-]{35}|hf_[A-Za-z0-9]{32,}|sk-[A-Za-z0-9]{32,}|OPENAI_API_KEY=[^$]' src/ scripts/ config/ *.sh 2>/dev/null; then
            echo "::error::Potential secret detected in tracked source"
            exit 1
          fi

  imports:
    name: Import resolvability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU torch first so sentence-transformers doesn't pull a CUDA build.
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # The external MasRouter (`MAR`) package is in the checker's optional set.
      - name: All top-level imports resolve
        run: python tools/check_imports.py
